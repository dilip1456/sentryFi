name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

# Least privilege by default; each job asks only for what it needs.
# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Dependabot (.github/dependabot.yml) keeps the pins up to date.
permissions: {}

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    # Read-only: this job runs third-party actions and handles the signing key,
    # so it must not be able to push to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Build web bundle
        run: npm run build

      - name: Remove APK from dist (stops recursive bundling)
        run: rm -rf dist/downloads/

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Sync Capacitor
        run: npx cap sync android --inline

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # The secret is passed through env, never interpolated into the script.
      - name: Decode release keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to build an unsigned or debug-signed release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > sentryfi-release.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          KEYSTORE_PATH: "sentryfi-release.keystore"
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        working-directory: android/app
        run: rm -f sentryfi-release.keystore

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK ($(du -sh "$APK" | cut -f1))"
          mkdir -p apk-out
          cp "$APK" apk-out/SentryFi.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentryfi-apk
          path: apk-out/SentryFi.apk
          if-no-files-found: error
          retention-days: 7

  # Only this job can write to the repo, and it runs no third-party code:
  # first-party checkout/download-artifact plus git.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sentryfi-apk
          path: apk-out

      - name: Commit APK
        run: |
          mkdir -p public/downloads
          cp apk-out/SentryFi.apk public/downloads/SentryFi.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/SentryFi.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            VERSION=$(node -p "require('./package.json').version")
            git commit -m "chore: APK v${VERSION} [skip ci]"
            git push
          fi
