name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
  workflow_dispatch:
    inputs:
      min_version_code:
        description: "Optional minVersionCode for version.json (installed builds below it get a blocking update prompt). Overrides android/min-version-code.txt. Leave empty to use the file."
        required: false
        default: ""

concurrency:
  group: apk-build
  cancel-in-progress: true

# Least privilege by default; each job asks only for what it needs.
# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Dependabot (.github/dependabot.yml) keeps the pins up to date.
permissions: {}

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    # Read-only: this job runs third-party actions and handles the signing key,
    # so it must not be able to push to the repo.
    permissions:
      contents: read
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts

      # versionCode must strictly increase on every published build (the in-app updater
      # compares it with the installed one). run_number only ever goes up for this workflow;
      # the 1000 offset keeps it above the old hard-coded versionCode 2.
      - name: Compute app version
        id: version
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          NAME=$(node -p "require('./package.json').version")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      # The web bundle needs the Supabase URL + publishable key at BUILD time
      # (Vite inlines import.meta.env.VITE_*). They used to come from a committed
      # .env, which was removed on 2026-10-16; without them the APK's JS throws
      # "supabaseUrl is required" on startup and the app opens to a blank screen.
      # These are public client values (they ship in every web bundle), so they
      # live in repo Actions *variables*; secrets of the same name also work.
      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set (repo Settings > Secrets and variables > Actions > Variables); refusing to build an APK that opens to a blank screen"
              exit 1
            fi
          done
          npm run build

      - name: Verify bundle has Supabase config inlined
        run: |
          if ! grep -qF "$VITE_SUPABASE_URL" dist/assets/*.js; then
            echo "::error::dist/assets/*.js does not contain VITE_SUPABASE_URL; the APK would open to a blank screen"
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}

      - name: Remove APK from dist (stops recursive bundling)
        run: rm -rf dist/downloads/

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Sync Capacitor
        run: npx cap sync android --inline

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # The secret is passed through env, never interpolated into the script.
      - name: Decode release keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to build an unsigned or debug-signed release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > sentryfi-release.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: "sentryfi-release.keystore"
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        working-directory: android/app
        run: rm -f sentryfi-release.keystore

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK ($(du -sh "$APK" | cut -f1))"
          mkdir -p apk-out
          cp "$APK" apk-out/SentryFi.apk

      # Fail loudly if the APK doesn't carry the versionCode we're about to publish.
      - name: Verify APK version
        env:
          WANT_CODE: ${{ steps.version.outputs.code }}
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::warning::aapt2 not found; skipping APK versionCode check"
            exit 0
          fi
          LINE=$("$AAPT2" dump badging apk-out/SentryFi.apk | head -1)
          echo "$LINE"
          case "$LINE" in
            *"versionCode='$WANT_CODE'"*) ;;
            *) echo "::error::APK versionCode does not match $WANT_CODE"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentryfi-apk
          path: apk-out/SentryFi.apk
          if-no-files-found: error
          retention-days: 7

  # Only this job can write to the repo, and it runs no third-party code:
  # first-party checkout/download-artifact plus git and the runner's preinstalled node
  # (an inline script below that writes version.json; no npm install).
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sentryfi-apk
          path: apk-out

      # version.json is what the in-app updater reads (src/lib/app-update). sha256 and size
      # are computed here, from the exact artifact being published.
      - name: Write version.json
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          MIN_VERSION_CODE_INPUT: ${{ inputs.min_version_code }}
        run: |
          mkdir -p public/downloads
          cp apk-out/SentryFi.apk public/downloads/SentryFi.apk
          MIN="$MIN_VERSION_CODE_INPUT"
          if [ -z "$MIN" ] && [ -f android/min-version-code.txt ]; then
            MIN=$(grep -oE '^[0-9]+' android/min-version-code.txt | head -1)
          fi
          MIN="${MIN:-0}"
          if ! [[ "$MIN" =~ ^[0-9]+$ ]]; then echo "::error::min_version_code must be an integer"; exit 1; fi
          if [ "$MIN" -gt "$VERSION_CODE" ]; then
            echo "::error::minVersionCode $MIN is above this build's versionCode $VERSION_CODE"; exit 1
          fi
          # One-line release notes: the commit subject, or the PR title for a merge commit.
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")
          if [[ "$SUBJECT" == "Merge pull request"* ]]; then
            TITLE=$(git log -1 --format=%b "$GITHUB_SHA" | sed '/^\s*$/d' | head -1)
            [ -n "$TITLE" ] && SUBJECT="$TITLE"
          fi
          export SHA256=$(sha256sum public/downloads/SentryFi.apk | cut -d' ' -f1)
          export SIZE=$(stat -c%s public/downloads/SentryFi.apk)
          export NOTES="$SUBJECT" MIN
          node -e '
            const e = process.env;
            const v = {
              versionName: e.VERSION_NAME,
              versionCode: Number(e.VERSION_CODE),
              sha256: e.SHA256,
              size: Number(e.SIZE),
              releaseNotes: e.NOTES.replace(/\s+/g, " ").trim().slice(0, 300),
              apkPath: "/downloads/SentryFi.apk",
              publishedAt: new Date().toISOString(),
            };
            if (Number(e.MIN) > 0) v.minVersionCode = Number(e.MIN);
            require("fs").writeFileSync("public/downloads/version.json", JSON.stringify(v, null, 2) + "\n");
          '
          cat public/downloads/version.json

      - name: Commit APK
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/SentryFi.apk public/downloads/version.json
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            VERSION=$(node -p "require('./package.json').version")
            git commit -m "chore: APK v${VERSION} (build ${VERSION_CODE}) [skip ci]"
            git push
          fi
