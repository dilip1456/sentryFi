apply plugin: 'com.android.application'

android {
    namespace = "com.sentryfi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sentryfi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI (build-apk.yml) passes APP_VERSION_CODE = 1000 + github.run_number so every
        // published APK has a strictly higher versionCode (the in-app updater compares it).
        // APP_VERSION_NAME comes from package.json. Local builds fall back to the values below.
        versionCode((System.getenv("APP_VERSION_CODE") ?: "2").toInteger())
        versionName(System.getenv("APP_VERSION_NAME") ?: "1.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Without this, the APK bundles native libraries for every CPU architecture
    // (arm64, armv7, x86, x86_64) -- roughly 3-4x larger than necessary, since
    // the overwhelming majority of real Android phones are arm64. Building a
    // single-ABI APK is the single biggest size win available here.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
        }
    }
    signingConfigs {
        release {
            // Release builds are signed only with the real release key from the
            // environment (CI: GitHub Actions secrets). There is deliberately no
            // fallback to the debug key: a debug-signed "release" APK can be
            // replaced by anyone (security audit M4). See the check below.
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_STORE_PASSWORD")
                keyAlias System.getenv("KEYSTORE_ALIAS")
                keyPassword System.getenv("KEYSTORE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "SentryFi-${variant.name}.apk"
        }
    }
}

// Fail any release build (assembleRelease, bundleRelease, installRelease, ...)
// that has no release keystore configured, instead of silently producing an
// unsigned or debug-signed APK. Debug builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(?i)^(assemble|bundle|package|install|sign).*Release.*$/
    }
    if (!wantsRelease) return
    def missing = ["KEYSTORE_PATH", "KEYSTORE_STORE_PASSWORD", "KEYSTORE_ALIAS", "KEYSTORE_KEY_PASSWORD"]
        .findAll { !System.getenv(it) }
    if (missing) {
        throw new GradleException("Release signing is not configured (missing env: ${missing.join(', ')}). " +
            "Release builds must be signed with the release keystore; there is no debug-key fallback. " +
            "Use assembleDebug for local builds.")
    }
    if (!file(System.getenv("KEYSTORE_PATH")).exists()) {
        throw new GradleException("KEYSTORE_PATH points to a file that does not exist: ${System.getenv('KEYSTORE_PATH')}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
